# Builds the Docker image, smoke-tests it, and publishes it to GHCR.
#   push to main -> ghcr.io/preswifi/agentry:latest and :sha-<short>
#   tag vX.Y.Z   -> also :X.Y.Z and :X.Y (tag must match agentry/__init__.py)
name: Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches agentry/__init__.py
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' agentry/__init__.py)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agentry:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker volume create agentry-test
          docker run -d --name agentry -p 8090:8090 -v agentry-test:/data agentry:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/healthz | grep -q '"ok":true'
          curl -sf http://127.0.0.1:8090/ | grep -q '<title>Agentry</title>'
          curl -sf http://127.0.0.1:8090/api/me | grep -q '"setup":true'
          code="$(docker logs agentry 2>&1 | sed -n 's/.*setup code: \([0-9a-f-]*\).*/\1/p' | head -1)"
          [ -n "$code" ] || { docker logs agentry; echo "::error::no setup code in log"; exit 1; }
          curl -sf -H 'X-Agentry: 1' -H 'Content-Type: application/json' -c jar \
            -d "{\"code\":\"$code\",\"username\":\"admin\",\"password\":\"smoke-test-pw\"}" http://127.0.0.1:8090/api/setup
          curl -sf -b jar http://127.0.0.1:8090/api/settings | grep -q '"secret_source":"file"'
          # Data survives a container replacement.
          docker rm -f agentry
          docker run -d --name agentry -p 8090:8090 -v agentry-test:/data agentry:test
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/healthz >/dev/null && break; sleep 1; done
          curl -sf -H 'X-Agentry: 1' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"smoke-test-pw"}' http://127.0.0.1:8090/api/login | grep -q '"ok":true'
          [ "$(docker exec agentry id -u)" != "0" ] || { echo "::error::runs as root"; exit 1; }
          for i in $(seq 1 40); do s="$(docker inspect -f '{{.State.Health.Status}}' agentry)"; [ "$s" = healthy ] && break; sleep 2; done
          echo "health: $s"; [ "$s" = healthy ]
          docker logs agentry 2>&1 | tail -20
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/agentry
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
