# Pull the published image:   docker compose pull && docker compose up -d
# Or build from this checkout: docker compose up -d --build
services:
  agentry:
    image: ghcr.io/preswifi/agentry:latest
    build: .
    container_name: agentry
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8090:8090"
    volumes:
      - agentry-data:/data

volumes:
  agentry-data:
